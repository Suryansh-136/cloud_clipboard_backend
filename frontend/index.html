<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Digital Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <div class="max-w-3xl w-full mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-indigo-400">Personal Digital Bridge</h1>
            <div id="authStatus" class="text-xs text-gray-400 bg-gray-800 px-3 py-1 rounded-full border border-gray-700">Not Logged In</div>
        </header>

        <!-- Auth Section -->
        <div id="authCard" class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg space-y-4">
            <div class="flex border-b border-gray-700 mb-4">
                <button id="tabLogin" class="py-2 px-4 font-semibold text-indigo-400 border-b-2 border-indigo-400">Login</button>
                <button id="tabRegister" class="py-2 px-4 font-semibold text-gray-400">Register</button>
            </div>
            
            <form id="authForm" class="space-y-4">
                <input type="email" id="authEmail" placeholder="Email" required class="w-full bg-gray-700 text-gray-200 border border-gray-600 rounded-lg p-2.5">
                <input type="password" id="authPassword" placeholder="Password" required class="w-full bg-gray-700 text-gray-200 border border-gray-600 rounded-lg p-2.5">
                <button type="submit" id="authBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg p-2.5">Login</button>
            </form>
        </div>

        <!-- Main App Section -->
        <div id="appCard" class="hidden space-y-6">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-200">Add New Snippet or File</h2>
                    <button id="logoutBtn" class="text-xs text-red-400 hover:underline">Logout</button>
                </div>

                <form id="uploadForm" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <select id="contentType" class="bg-gray-700 text-gray-200 border border-gray-600 rounded-lg p-2.5">
                            <option value="text">Text / Snippet</option>
                            <option value="file">File / Media</option>
                        </select>
                        <input type="text" id="itemTitle" placeholder="Title (optional)" class="sm:col-span-2 bg-gray-700 text-gray-200 border border-gray-600 rounded-lg p-2.5">
                    </div>

                    <div id="textInputArea">
                        <textarea id="textPayload" rows="4" placeholder="Paste your text or URL here..." class="w-full bg-gray-700 text-gray-200 border border-gray-600 rounded-lg p-2.5"></textarea>
                    </div>

                    <div id="fileInputArea" class="hidden">
                        <input type="file" id="filePayload" class="block w-full text-sm text-gray-400 border border-gray-600 rounded-lg bg-gray-700 p-2">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg p-2.5">Save Item</button>
                </form>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg space-y-4">
                <h2 class="text-lg font-semibold text-gray-200">Your Saved Items</h2>
                <div id="itemList" class="space-y-3"><p class="text-sm text-gray-400 italic">No items yet.</p></div>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        let token = localStorage.getItem('token');

        const authCard = document.getElementById('authCard');
        const appCard = document.getElementById('appCard');
        const authStatus = document.getElementById('authStatus');
        const contentType = document.getElementById('contentType');
        const textInputArea = document.getElementById('textInputArea');
        const fileInputArea = document.getElementById('fileInputArea');

        // Helper to escape unsafe HTML chars
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        // Toggle Content Type UI
        contentType.addEventListener('change', () => {
            if (contentType.value === 'file') {
                textInputArea.classList.add('hidden');
                fileInputArea.classList.remove('hidden');
            } else {
                textInputArea.classList.remove('hidden');
                fileInputArea.classList.add('hidden');
            }
        });

        function checkAuth() {
            token = localStorage.getItem('token');
            if (token) {
                authCard.classList.add('hidden');
                appCard.classList.remove('hidden');
                authStatus.innerText = 'Authenticated';
                loadItems();
            } else {
                authCard.classList.remove('hidden');
                appCard.classList.add('hidden');
                authStatus.innerText = 'Not Logged In';
            }
        }

        // Toggle Tabs
        document.getElementById('tabLogin').onclick = () => { 
            isLogin = true; 
            document.getElementById('authBtn').innerText = 'Login';
            document.getElementById('tabLogin').className = 'py-2 px-4 font-semibold text-indigo-400 border-b-2 border-indigo-400';
            document.getElementById('tabRegister').className = 'py-2 px-4 font-semibold text-gray-400';
        };
        
        document.getElementById('tabRegister').onclick = () => { 
            isLogin = false; 
            document.getElementById('authBtn').innerText = 'Register';
            document.getElementById('tabRegister').className = 'py-2 px-4 font-semibold text-indigo-400 border-b-2 border-indigo-400';
            document.getElementById('tabLogin').className = 'py-2 px-4 font-semibold text-gray-400';
        };

        // Auth Submit Handler
        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const endpoint = isLogin ? '/api/v1/auth/login' : '/api/v1/auth/register';

            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: isLogin ? { 'Content-Type': 'application/x-www-form-urlencoded' } : { 'Content-Type': 'application/json' },
                body: isLogin ? formData : JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                if (isLogin) {
                    localStorage.setItem('token', data.access_token);
                    checkAuth();
                } else {
                    alert('Registration successful! Please login.');
                    document.getElementById('tabLogin').click();
                }
            } else {
                alert(data.detail || 'Authentication failed');
            }
        };

        // Logout Handler
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('token');
            checkAuth();
        };

        // Fetch Items
        async function loadItems() {
            if (!token) return;

            const res = await fetch('/api/v1/items/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 401) {
                localStorage.removeItem('token');
                checkAuth();
                return;
            }

            if (res.ok) {
                const items = await res.json();
                const list = document.getElementById('itemList');
                if (items.length === 0) {
                    list.innerHTML = '<p class="text-sm text-gray-400 italic">No items saved yet.</p>';
                    return;
                }
                list.innerHTML = items.map(i => `
                    <div class="bg-gray-700 p-3 rounded-lg flex justify-between items-center">
                        <div>
                            <span class="text-xs font-bold text-indigo-400 uppercase">${escapeHtml(i.content_type)}</span>
                            <p class="text-sm text-gray-200 mt-1 whitespace-pre-wrap">${escapeHtml(i.text_payload || 'File Attachment')}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${i.file_path ? `<a href="${i.file_path}" target="_blank" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-white font-medium">Download</a>` : ''}
                            <button onclick="deleteItem(${i.id})" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1">Delete</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Delete Item Handler
        async function deleteItem(itemId) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            const res = await fetch(`/api/v1/items/${itemId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                loadItems();
            } else {
                alert('Failed to delete item.');
            }
        }

        // Save / Upload Item Handler
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const type = document.getElementById('contentType').value;
            const title = document.getElementById('itemTitle').value;

            let res;

            if (type === 'file') {
                const fileInput = document.getElementById('filePayload');
                if (!fileInput.files[0]) {
                    alert('Please select a file to upload.');
                    return;
                }

                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                if (title) formData.append('title', title);

                res = await fetch('/api/v1/items/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
            } else {
                const text = document.getElementById('textPayload').value;
                res = await fetch('/api/v1/items/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content_type: type, text_payload: text })
                });
            }

            if (res.ok) {
                document.getElementById('textPayload').value = '';
                document.getElementById('filePayload').value = '';
                document.getElementById('itemTitle').value = '';
                loadItems();
            } else {
                const err = await res.json();
                alert(err.detail || 'Failed to save item.');
            }
        };

        // Initial Auth check
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
