<!-- Inside frontend/index.html: Replace the Add Item Form inside <main> -->
<section class="bg-slate-800 p-4 sm:p-6 rounded-lg border border-slate-700">
    <h2 class="text-lg font-semibold mb-4 text-sky-300">Add New Snippet, Link, or File</h2>
    <form onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">
            <select id="item-type" onchange="toggleInputType()" class="bg-slate-900 border border-slate-700 rounded p-2 text-white sm:w-40 focus:outline-none">
                <option value="text">Text Note</option>
                <option value="link">Web Link</option>
                <option value="file">File / Image Upload</option>
            </select>
            <input type="text" id="item-title" placeholder="Title (optional)" class="w-full sm:flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-400">
        </div>

        <!-- Text / Link Input -->
        <div id="text-input-container">
            <textarea id="item-content" rows="3" placeholder="Paste your text or URL here..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-400"></textarea>
        </div>

        <!-- File Upload Input (Hidden by default) -->
        <div id="file-input-container" class="hidden">
            <label class="block text-sm font-medium text-slate-300 mb-2">Choose File to Upload (Images, PDFs, Docs)</label>
            <input type="file" id="item-file" class="w-full bg-slate-900 border border-slate-700 text-slate-300 rounded p-2 text-sm file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500 cursor-pointer">
        </div>

        <button type="submit" id="submit-btn" class="w-full sm:w-auto bg-sky-500 hover:bg-sky-400 font-bold px-6 py-2 rounded text-white flex items-center justify-center gap-2">
            <span>Save Item</span>
        </button>
    </form>
</section>
